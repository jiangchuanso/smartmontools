name: Build smartmontools (non-release)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # job to create tar.gz tarball, used by other builders
  make-src-tgz:
    runs-on: ubuntu-latest
    name: Create smartmontools dist
    outputs:
      SOURCE_DATE_EPOCH: ${{ steps.set-env.outputs.SOURCE_DATE_EPOCH }}
      SMARTMONTOOLS_PKG_VER: ${{ steps.set-env.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_VER_FNAME: ${{ steps.set-env.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}

      artficact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Provide at least the commit log sufficient for 'git-set-mtime.sh'.
          # 'git clone --shallow-since=2011-06-15' would be sufficient but this is
          # not supported by 'actions/checkout@v6'.
          fetch-depth: 3500
          # Include (future) release tags for 'getversion.sh'
          fetch-tags: true
      - name: Setting environment variables
        id: set-env
        run: |
          version_sh=$(util/getversion.sh -s) && eval "${version_sh}" &&
          SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          echo SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} >> $GITHUB_ENV &&
          echo SMARTMONTOOLS_PKG_VER=${SMARTMONTOOLS_PKG_VER} >> $GITHUB_ENV &&
          echo SMARTMONTOOLS_GIT_VER_FNAME=${SMARTMONTOOLS_GIT_VER_FNAME} >> $GITHUB_ENV &&
          cat $GITHUB_ENV | tee $GITHUB_OUTPUT

      - name: Creating src.tar.gz
        run: |
          util/git-set-mtime.sh -f -q &&
          ./autogen.sh --force &&
          mkdir build && cd build &&
          ../configure SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make dist && tar -tvzf "smartmontools-${SMARTMONTOOLS_PKG_VER}.tar.gz" &&
          mkdir artifacts &&
          echo ${SOURCE_DATE_EPOCH} > artifacts/SOURCE_DATE_EPOCH &&
          touch -d @${SOURCE_DATE_EPOCH} artifacts/SOURCE_DATE_EPOCH &&
          mv smartmontools-${SMARTMONTOOLS_PKG_VER}.tar.gz artifacts/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz

      - name: Upload artifacts
        id: artifact-upload-step
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: build/artifacts/
          retention-days: 1

  compile-linux-static-x86_64:
    name: Creating static x86_64 linux binaries
    needs: make-src-tgz
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.make-src-tgz.outputs.SOURCE_DATE_EPOCH }}
      SMARTMONTOOLS_PKG_VER: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_VER_FNAME: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}      
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.make-src-tgz.outputs.artficact-id }}      
          path: artifacts
      - name: build
        run: |
          tar -xvf artifacts/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz &&
          cd smartmontools-${SMARTMONTOOLS_PKG_VER} && mkdir build && cd build &&
          ../configure --with-build-info='(GHA Build)' --enable-static-link \
            SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make -j && make check &&
          mkdir -p ${GITHUB_WORKSPACE}/artifacts &&
          make bin-dist bin_distfile="${GITHUB_WORKSPACE}/artifacts/smartmontools-linux-x86_64-static-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux_static_x86_64
          path: artifacts/smartmontools-linux-x86_64-static-${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}.tar.gz
          retention-days: 1

  compile-linux-static-i386:
    name: Creating static i386 linux binaries
    needs: make-src-tgz
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.make-src-tgz.outputs.SOURCE_DATE_EPOCH }}
      SMARTMONTOOLS_PKG_VER: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_VER_FNAME: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}      
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.make-src-tgz.outputs.artficact-id }}    
          path: artifacts
      - name: install m32 dependencies
        run: sudo apt-get update && sudo apt-get install gcc-multilib g++-multilib
      - name: build
        # 'config.guess' from automake 1.16 misdetects 'host=x86_64-pc-linux-gnux32' (x86_64 with x32 ABI).
        # With 'setarch i686 ...' it correctly detects 'host=i686-pc-linux-gnu'.
        # TODO: Remove this workaround if 'ubuntu-latest' provides automake >= 1.17.
        run: |
          tar -xvf artifacts/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz &&
          cd smartmontools-${SMARTMONTOOLS_PKG_VER} && mkdir build && cd build &&
          setarch i686 ../configure --with-build-info='(GHA Build)' --enable-static-link \
            CC="gcc -m32" CXX="g++ -m32" SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make -j && make check &&
          mkdir -p ${GITHUB_WORKSPACE}/artifacts &&
          make bin-dist bin_distfile="${GITHUB_WORKSPACE}/artifacts/smartmontools-linux-i386-static-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux_static_i386
          path: artifacts/smartmontools-linux-i386-static-${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}.tar.gz
          retention-days: 1

  compile-darwin:
    name: Creating Darwin image
    needs: make-src-tgz
    runs-on: ubuntu-latest
    # we are using clang/osxcross to build it, so running in container
    # see smartmontools/docker-build for the source
    container: 
      image: ghcr.io/smartmontools/docker-build:master     
    env:
      SOURCE_DATE_EPOCH: ${{ needs.make-src-tgz.outputs.SOURCE_DATE_EPOCH }}
      SMARTMONTOOLS_PKG_VER: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_VER_FNAME: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }} 
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.make-src-tgz.outputs.artficact-id }}
          path: artifacts
      - name: build
        run: |
          export PATH=/usr/osxcross/bin/:$PATH &&
          export LD_LIBRARY_PATH=/usr/osxcross/lib &&
          tar -xvf artifacts/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz &&
          cd smartmontools-${SMARTMONTOOLS_PKG_VER} &&
          mkdir build && cd build &&
          ../configure --build=$(../config.guess) --host=x86_64-apple-darwin20.4 \
            --sysconfdir=/private/etc --with-build-info='(GHA Build)' \
            'CC=o64-clang' 'CXX=o64-clang++' 'CFLAGS=-arch arm64 -arch x86_64' \
            'CXXFLAGS=-arch arm64 -arch x86_64 -stdlib=libc++' \
            SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make -j && make check &&
          make pkg_darwin=smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.pkg dmg_darwin=smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.dmg install-darwin &&
          mkdir -p inst ${GITHUB_WORKSPACE}/artifacts &&
          mv ./src/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.dmg ${GITHUB_WORKSPACE}/artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darwin
          path: artifacts/smartmontools-${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}.dmg
          retention-days: 1
  
  compile-freebsd:
    name: Creating FreeBSD binaries
    needs: make-src-tgz
    runs-on: ubuntu-latest
    # FreeBSD cross-compilation. We need to check, very possible it would be
    # faster to do everything in normal runner, by installing things locally
    # and using cache
    container: 
      image: ghcr.io/smartmontools/docker-build:master     
    env:
      SOURCE_DATE_EPOCH: ${{ needs.make-src-tgz.outputs.SOURCE_DATE_EPOCH }}
      SMARTMONTOOLS_PKG_VER: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_VER_FNAME: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }} 
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.make-src-tgz.outputs.artficact-id }}
          path: artifacts
      - name: FreeBSD 14 build
        run: |
          tar -xvf artifacts/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz &&
          cd smartmontools-${SMARTMONTOOLS_PKG_VER} &&
          mkdir build && cd build &&
          export TARGET="-target x86_64-unknown-freebsd14 --sysroot=/opt/cross-freebsd-14/" &&
          TARGET="$TARGET -isystem /opt/cross-freebsd-14/usr/include/c++/v1" &&
          ../configure --host=x86_64-pc-freebsd14 --with-build-info='(GHA Build)' --enable-static-link \
            CC="clang $TARGET" CXX="clang++ $TARGET" SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make -j && make check &&
          mkdir -p ${GITHUB_WORKSPACE}/artifacts &&
          make bin-dist bin_distfile="${GITHUB_WORKSPACE}/artifacts/smartmontools-freebsd-14-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: freebsd14
          path: artifacts/smartmontools-freebsd-14-${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}.tar.gz
          retention-days: 1
      - name: cleanup
        run: rm -rf smartmontools-${SMARTMONTOOLS_PKG_VER}
      - name: FreeBSD 15 build
        run: |
          tar -xvf artifacts/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz &&
          cd smartmontools-${SMARTMONTOOLS_PKG_VER} &&
          mkdir build && cd build &&
          export TARGET="-target x86_64-unknown-freebsd15 --sysroot=/opt/cross-freebsd-15/" &&
          TARGET="$TARGET -isystem /opt/cross-freebsd-15/usr/include/c++/v1" &&
          ../configure --host=x86_64-pc-freebsd15 --with-build-info='(GHA Build)' --enable-static-link \
            CC="clang $TARGET" CXX="clang++ $TARGET" SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make -j && make check &&
          mkdir -p ${GITHUB_WORKSPACE}/artifacts &&
          make bin-dist bin_distfile="${GITHUB_WORKSPACE}/artifacts/smartmontools-freebsd-15-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: freebsd15
          path: artifacts/smartmontools-freebsd-15-${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}.tar.gz
          retention-days: 1

  compile-windows:
    name: Creating Windows binary
    needs: make-src-tgz
    runs-on: ubuntu-latest
    # windows cross-compilation, also running using our build container
    # based on Debian 12. Probably could be migrated to normal ubuntu runner
    # need to test this
    container: 
      image: ghcr.io/smartmontools/docker-build:master     
    env:
      SOURCE_DATE_EPOCH: ${{ needs.make-src-tgz.outputs.SOURCE_DATE_EPOCH }}
      SMARTMONTOOLS_PKG_VER: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_VER_FNAME: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.make-src-tgz.outputs.artficact-id }}
          path: artifacts
      - name: Windows build
        run: |
          tar -xvf artifacts/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz &&
          cd smartmontools-${SMARTMONTOOLS_PKG_VER} &&
          mkdir build && cd build &&
          ../configure --build=$(../config.guess) --host=i686-w64-mingw32 \
            --with-build-info='(GHA Build)' --enable-static-link \
            SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make -j && make check && make distdir-win32 &&
          cd .. && mkdir build64 && cd build64 &&
          ../configure --build=$(../config.guess) --host=x86_64-w64-mingw32 \
            --with-build-info='(GHA Build)' --enable-static-link \
            SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make -j && make check && make distdir-win32 &&
          cd ../build &&
          dest="smartmontools-win32-setup-${SMARTMONTOOLS_GIT_VER_FNAME}.exe" && \
            make builddir_win64=../../build64/src distinst_win32="$dest" installer-win32 &&
          mkdir -p inst ${GITHUB_WORKSPACE}/artifacts && make DESTDIR="$(pwd)/inst" install &&
          mv ./src/smartmontools-win32-setup-${SMARTMONTOOLS_GIT_VER_FNAME}.exe ${GITHUB_WORKSPACE}/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/smartmontools-win32-setup-${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}.exe
          retention-days: 1

  compile-cygwin:
    name: Creating Cygwin binaries
    needs: make-src-tgz
    runs-on: ubuntu-latest
    # Cross build on Fedora is faster than the native build done by 'cygwin.yml'.
    # The recipes below are partly borrowed from Cygwin's own CI build
    # NOTE: the cross toolchain comes from COPR ('download.copr.fedorainfracloud.org'),
    # which is an unreliable single backend. The retry loop below tolerates that;
    # see the comment there before "simplifying" it.
    container: fedora:latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.make-src-tgz.outputs.SOURCE_DATE_EPOCH }}
      SMARTMONTOOLS_PKG_VER: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_VER_FNAME: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y make
      - name: Enable 'dnf copr'
        run: |
          dnf install -y dnf-plugins-core
      - name: Install cross-cygwin toolchain
        run: |
          # 'download.copr.fedorainfracloud.org' is a single backend and from time to
          # time answers with 'Curl error 28' (transfer below the 1000 B/s default
          # 'minrate' for 30 s) or HTTP 504. 'dnf copr enable' writes
          # 'skip_if_unavailable=True' into the generated repo file, so such a failure
          # does NOT abort the command: the repo is skipped silently and the run then
          # dies further down with the misleading 'No match for argument:
          # cygwin64-gcc-c++' (that is what happened on 2026-09-22).
          #
          # So: disable the low speed abort ('minrate=0'), raise the timeout, drop the
          # possibly half fetched metadata and retry. dnf5 no longer has the 'retries'
          # option of dnf4, hence the loop. '@cygwin/cygwin' is Cygwin's own CI project
          # (actively rebuilt for every Fedora release) and serves as a fallback for
          # the historical personal project 'yselkowitz/cygwin'.
          #
          # The loop is driven by a time budget instead of a fixed attempt count: on
          # 2026-09-22 BOTH projects answered with HTTP 504 for longer than the 12 min
          # that '3 attempts per project' could cover. 'dnf' keeps the RPMs of a failed
          # transaction in its cache, so each attempt needs fewer successful transfers
          # than the previous one: keep alternating between the two projects until the
          # toolchain is installed or the budget is used up.
          budget=1500
          start=$(date +%s)
          attempt=0
          backoff=10
          while [ "$(( $(date +%s) - start ))" -lt "${budget}" ]; do
            for repo in yselkowitz/cygwin @cygwin/cygwin; do
              attempt=$((attempt + 1))
              echo "=== Installing cygwin64-gcc-c++ from '${repo}'" \
                "(attempt ${attempt}, $(( $(date +%s) - start ))s of ${budget}s used)"
              dnf clean metadata >/dev/null 2>&1 || true
              if dnf --setopt=minrate=0 --setopt=timeout=120 copr enable -y "${repo}" &&
                 dnf --setopt=minrate=0 --setopt=timeout=120 install -y cygwin64-gcc-c++; then
                echo "=== cygwin64-gcc-c++ installed from '${repo}'"
                exit 0
              fi
              dnf copr disable -y "${repo}" || true
              echo "=== Attempt ${attempt} from '${repo}' failed, sleeping ${backoff}s"
              sleep "${backoff}"
              backoff=$((backoff * 2))
              if [ "${backoff}" -gt 30 ]; then backoff=30; fi
            done
          done
          dnf repolist || true
          echo "::error::The Cygwin cross toolchain could not be installed from any COPR repository"
          exit 1
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.make-src-tgz.outputs.artficact-id }}
          path: artifacts
      - name: Cygwin build
        run: |
          tar -xvf artifacts/smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz &&
          cd smartmontools-${SMARTMONTOOLS_PKG_VER} && mkdir build && cd build &&
          ../configure --build=$(../config.guess) --host=x86_64-pc-cygwin \
            --with-build-info='(GHA Build)' SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} &&
          make -j && make check &&
          mkdir -p ${GITHUB_WORKSPACE}/artifacts &&
          make bin-dist bin_distfile="${GITHUB_WORKSPACE}/artifacts/smartmontools-cygwin-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cygwin
          path: artifacts/smartmontools-cygwin-${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}.tar.gz
          retention-days: 1

  build-rpm-el8:
    # Build the el8 RPMs from the very same source tarball and the very same
    # version information as every other artifact of this run.
    # The reusable workflow uploads the RPMs as artifacts only; they are
    # published together with everything else by 'publish-artifacts' below.
    name: Build el8 RPMs
    needs: make-src-tgz
    # 'continue-on-error' is NOT supported on a job that calls a reusable
    # workflow via 'uses:' (it triggers a schema error). A failed RPM build
    # therefore intentionally blocks the release, so a release is never
    # published without its RPMs.
    if: github.event_name != 'pull_request'
    # The callee's 'build-rpm' job declares 'contents: write' for its optional
    # 'attach to release' step (manual runs only). The effective permissions of
    # a reusable workflow job are the intersection of caller and callee, so the
    # write permission must be granted here as well.
    permissions:
      contents: write
    uses: ./.github/workflows/build-centos8-rpm.yml
    with:
      pkg_ver: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_PKG_VER }}
      git_ver_fname: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}
      source_date_epoch: ${{ needs.make-src-tgz.outputs.SOURCE_DATE_EPOCH }}

  publish-artifacts:
    # Publish all built artifacts to a GitHub Release on THIS repository.
    # 'merge-multiple: true' below merges EVERY artifact of this run, so the
    # tar.gz, the static binaries, dmg, exe, cygwin tarball and the el8 RPMs
    # all end up in one single release with one single version number.
    # Runs only on pushes to 'main' of this repo.
    #
    # 'always()' is required because 'compile-cygwin' is listed in 'needs' below but
    # must NOT block the release: its cross toolchain comes from COPR, a third party
    # CDN which is regularly unavailable (see the retry loop in 'compile-cygwin').
    # Every OTHER dependency must still have succeeded, so a release is never
    # published without its source tarball, its RPMs or the other binaries.
    # NOTE: every line below must keep the SAME indentation, otherwise YAML treats
    # the more indented ones as literal text (keeping the newlines) instead of
    # folding them into the single line the expression parser expects.
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.make-src-tgz.result == 'success' &&
      needs.compile-linux-static-x86_64.result == 'success' &&
      needs.compile-linux-static-i386.result == 'success' &&
      needs.compile-darwin.result == 'success' &&
      needs.compile-freebsd.result == 'success' &&
      needs.compile-windows.result == 'success' &&
      needs.build-rpm-el8.result == 'success' }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.make-src-tgz.outputs.SOURCE_DATE_EPOCH }}
      SMARTMONTOOLS_PKG_VER: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_PKG_VER }}
      SMARTMONTOOLS_GIT_VER_FNAME: ${{ needs.make-src-tgz.outputs.SMARTMONTOOLS_GIT_VER_FNAME }}
    name: publish-artifacts
    needs: 
      - make-src-tgz
      - compile-linux-static-x86_64
      - compile-linux-static-i386
      - compile-darwin
      - compile-freebsd
      - compile-windows
      - compile-cygwin
      - build-rpm-el8
    runs-on: ubuntu-latest
    # 'contents: write' is required for the default GITHUB_TOKEN to create
    # releases and tags.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts
      - name: gh release delete (cleanup same name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # remove a release with the same version tag before recreating it
        run: |
          gh release delete "smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}" \
            --repo ${{ github.repository }} --yes --cleanup-tag || true
      - name: gh create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 'compile-cygwin' is allowed to fail (see the job condition above), so a
          # release without the Cygwin tarball must be explicit instead of silent.
          notes=$(printf '%s\n' "Smartmontools CI build: [smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}](https://github.com/${{ github.repository }}/tree/${GITHUB_SHA})")
          if ! compgen -G 'artifacts/smartmontools-cygwin-*.tar.gz' >/dev/null; then
            echo "::warning::This release has no Cygwin tarball ('compile-cygwin' result: '${{ needs.compile-cygwin.result }}')"
            notes=$(printf '%s\n\n%s\n' "${notes}" \
              "**Note**: the Cygwin binaries are missing from this release because the COPR cross toolchain could not be installed; see the 'compile-cygwin' job for details.")
          fi
          gh release create "smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}" \
            artifacts/* \
            --repo ${{ github.repository }} \
            --notes "${notes}" \
            --prerelease
      - name: Clean old builds
        # Leave only last 50 builds and delete everything else
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}        
        run: |
          gh -R ${{ github.repository }} release list \
            -L 100 --json tagName -q '.[50:][]|.tagName' | \
            xargs -n1 --no-run-if-empty \
            gh -R ${{ github.repository }} release delete --cleanup-tag --yes
